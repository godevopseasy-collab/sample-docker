events {}

http {
    server {
        listen 80;

        # Route /app → sample-app container
        location /app {
            proxy_pass http://sample-app:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Route /ai → ai-agent container
        location /ai {
            proxy_pass http://ai-agent:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
