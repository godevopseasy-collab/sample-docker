version: "3.8"

services:
  sample-app:
    image: easygodevops/sample-app:latest
    container_name: sample-app
    ports:
      - "3000:3000"

  ai-agent:
    image: easygodevops/ai-agent:latest
    container_name: ai-agent
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8000:8000"

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - sample-app
      - ai-agent
