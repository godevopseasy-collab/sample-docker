name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]   # run when pushing tags like v1.0.1
  workflow_dispatch:   # allows manual trigger from Actions tab

env:
  IMAGE_NAME: easygodevops/sample-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user   # or ubuntu depending on your AMI
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # ensure docker group permissions
            sudo usermod -aG docker ec2-user || true
            newgrp docker || true

            # pull and run container
            docker pull ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            docker stop sample-app || true
            docker rm sample-app || true
            docker run -d --name sample-app -p 80:3000 ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
