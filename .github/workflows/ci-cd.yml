name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

env:
  SAMPLE_IMAGE: easygodevops/sample-app
  AI_IMAGE: easygodevops/ai-agent

jobs:
  build-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v4
        with:
          context: ./sample-app
          push: true
          tags: |
            ${{ env.SAMPLE_IMAGE }}:latest
            ${{ env.SAMPLE_IMAGE }}:${{ github.sha }}
            ${{ env.SAMPLE_IMAGE }}:${{ github.ref_name }}

  build-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v4
        with:
          context: ./ai-agent
          push: true
          tags: |
            ${{ env.AI_IMAGE }}:latest
            ${{ env.AI_IMAGE }}:${{ github.sha }}
            ${{ env.AI_IMAGE }}:${{ github.ref_name }}

  deploy-compose:
    runs-on: ubuntu-latest
    needs: [build-sample, build-ai]
    steps:
      - uses: actions/checkout@v3
      - name: SSH into EC2 and deploy stack
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app || mkdir ~/app && cd ~/app
            rm -rf repo || true
            git clone https://github.com/<your-username>/<your-repo>.git repo
            cd repo
            docker compose down || true
            docker pull ${{ env.SAMPLE_IMAGE }}:latest
            docker pull ${{ env.AI_IMAGE }}:latest
            docker compose up -d --build
