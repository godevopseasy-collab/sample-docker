name: CI/CD Pipeline

on:
  push:
    branches: [ "feature-ai" ]
    tags: [ "v*" ]
  workflow_dispatch:

env:
  SAMPLE_IMAGE: easygodevops/sample-app
  AI_IMAGE: easygodevops/ai-agent

jobs:
  build-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v4
        with:
          context: ./sample-app
          push: true
          tags: |
            ${{ env.SAMPLE_IMAGE }}:latest
            ${{ env.SAMPLE_IMAGE }}:${{ github.sha }}
            ${{ env.SAMPLE_IMAGE }}:${{ github.ref_name }}

  build-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v4
        with:
          context: ./ai-agent
          push: true
          tags: |
            ${{ env.AI_IMAGE }}:latest
            ${{ env.AI_IMAGE }}:${{ github.sha }}
            ${{ env.AI_IMAGE }}:${{ github.ref_name }}

  deploy-compose:
    runs-on: ubuntu-latest
    needs: [build-sample, build-ai]
    steps:
      - uses: actions/checkout@v3
      - name: SSH into EC2 and deploy stack
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Ensure working directory exists
            mkdir -p /home/ec2-user/app
            cd /home/ec2-user/app

            # Install Git if missing
            if ! command -v git &> /dev/null; then
              sudo yum install -y git
            fi

            # Clone repo with compose file
            rm -rf repo || true
            git clone https://github.com/godevopseasy-collab/sample-docker.git repo
            cd repo

            # Install Docker Compose v2 if missing
            if ! command -v docker-compose &> /dev/null; then
              sudo curl -SL https://github.com/docker/compose/releases/download/v2.27.1/docker-compose-linux-x86_64 \
                -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi

            # Pull latest images
            docker pull ${{ env.SAMPLE_IMAGE }}:latest
            docker pull ${{ env.AI_IMAGE }}:latest

            # Restart stack
            docker-compose down || true
            docker-compose up -d

            # Health check
            sleep 10
            curl -f http://localhost/app || exit 1
            curl -f "http://localhost/ai?q=Hello" || exit 1
